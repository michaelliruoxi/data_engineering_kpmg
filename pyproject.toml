[project]
name = "sec-pipeline"
version = "0.1.0"
description = "Verified SEC sample acquisition and filing-linked financial statement export"
readme = "readme.md"
authors = [
    { name = "Qiwei (Emma) Shan", email = "qs2314@columbia.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "edgartools==5.59.1",
    "httpx>=0.25,<0.29",
    "lxml>=5,<7",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[project.scripts]
sec-pipeline = "sec_pipeline:main"
sec-db = "sec_pipeline.db_cli:main"

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"
