name: Database contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: sec_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d sec_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: sec_ci_config
      PGSSLMODE: disable
      SEC_DB_TEST: '1'
      SEC_DB_TEST_DATABASE: sec_ci_test
      SEC_DB_CONCURRENCY_TEST: '1'
      SEC_FACTS_BRIDGE_SAMPLE: '1'
      SEC_BULK_TEST: '1'
      SEC_BULK_TEST_DATABASE: sec_ci_test
      SEC_ISSUER_HISTORY_TEST: '1'
      SEC_ISSUER_HISTORY_TEST_DATABASE: sec_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked
      - name: Create disposable reader role before grants
        run: psql -d sec_ci_test -v ON_ERROR_STOP=1 -c "CREATE ROLE sec_reader NOLOGIN"
      - name: Migrate dedicated local database
        run: PGDATABASE=sec_ci_test uv run --locked sec-db migrate
      - name: Pure, PostgreSQL, publication and concurrency tests
        run: uv run --locked python -m pytest -q -ra
      - name: Existing committed ingestion transaction tests
        run: |
          cat > .env.ci <<'EOF'
          PGHOST=127.0.0.1
          PGPORT=5432
          PGUSER=postgres
          PGPASSWORD=local-test-only
          PGDATABASE=sec_ci_config
          PGSSLMODE=disable
          EOF
          uv run --locked python scripts/test_ingestion_local.py --env-file .env.ci --database sec_ci_test
      - name: Real Microsoft facts and tables replay
        run: uv run --locked python scripts/run_tables_postgres_tests.py --host 127.0.0.1 --port 5432 --database sec_ci_test --user postgres
      - name: Real source relationship, section replay and rollback checks
        run: |
          uv run --locked python scripts/prepare_relations_ci_fixture.py --output /tmp/sec-relations-exports
          createdb sec_relations_test
          uv run --locked python scripts/run_table_relations_local.py --host 127.0.0.1 --port 5432 --database sec_relations_test --user postgres --source-root "$PWD" --table-exports /tmp/sec-relations-exports --sections /tmp/sec-relations-exports/sections.json --output /tmp/sec-relations-evidence --test-section-proposal
          SEC_RELATIONS_DB_TEST=1 SEC_RELATIONS_DB_DATABASE=sec_relations_test SEC_RELATIONS_SOURCE_ROOT="$PWD" uv run --locked python -m pytest tests/test_table_relations_postgres.py -q -ra
      - name: Citation integration retains missing real-producer blocker
        run: |
          status=0
          uv run --locked python scripts/replay_table_citations.py --snapshot /tmp/sec-relations-evidence/snapshot.json --source-root "$PWD" --output /tmp/sec-relations-citations.json || status=$?
          test "$status" -eq 2
          uv run --locked python -c "import json; r=json.load(open('/tmp/sec-relations-citations.json')); assert r['status']=='incomplete'; assert len(r['citations'])==3; assert all(not c['chunks'] and len(c['trace_examples'][0]['source_receipts'])==2 for c in r['citations'])"
